<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TX Config · LoRa + ESP-NOW Transmitter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#090d13;--bg2:#0c121b;--panel:#101824;--panel2:#0d141f;--line:#1b2636;--line2:#2a3a52;
--text:#d5deeb;--mut:#8493ab;--dim:#5a6a82;--accent:#00b4ff;--accentd:#00b4ff1f;
--warn:#f59e0b;--bad:#ef4444;--ok:#22c55e;
--mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:52px 1fr;height:100vh;min-width:1024px}
.app.col{grid-template-columns:62px 1fr}
.side{grid-row:1/3;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{height:52px;display:flex;align-items:center;gap:11px;padding:0 15px;border-bottom:1px solid var(--line);flex:none}
.logo{width:28px;height:28px;border:1.5px solid var(--accent);display:grid;place-items:center;color:var(--accent);flex:none;border-radius:3px}
.logo svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bt b{display:block;font:700 12px var(--mono);letter-spacing:.14em}
.bt span{font-size:10px;color:var(--mut);letter-spacing:.06em;white-space:nowrap}
nav{flex:1;padding:12px 8px;overflow:auto}
.ni{display:flex;align-items:center;gap:12px;width:100%;height:37px;padding:0 11px;background:none;border:0;border-left:2px solid transparent;color:var(--mut);cursor:pointer;text-align:left;border-radius:0 3px 3px 0;margin-bottom:2px;position:relative;white-space:nowrap}
.ni:hover{background:#ffffff08;color:var(--text)}
.ni.on{background:var(--accentd);color:var(--accent);border-left-color:var(--accent)}
.ni svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni .nd{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--warn);display:none;flex:none}
.ni.dirty .nd{display:block}
.sidefoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;flex:none}
.sidefoot button{width:30px;height:30px;background:none;border:1px solid var(--line2);border-radius:3px;color:var(--mut);cursor:pointer;display:grid;place-items:center;flex:none}
.sidefoot button:hover{color:var(--accent);border-color:var(--accent)}
.sidefoot svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ver{font-size:10px;color:var(--dim);white-space:nowrap}
.col .ni .t,.col .bt,.col .ver,.col .ni .nd{display:none}
.col .brand{padding:0 16px}
.col .ni{padding:0 15px}
.top{grid-column:2;display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 12px;border-radius:13px;font:600 11px var(--mono);letter-spacing:.06em;border:1px solid;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.ok{color:var(--ok);border-color:#22c55e55;background:#22c55e14}
.pill.warn{color:var(--warn);border-color:#f59e0b55;background:#f59e0b14}
.pill.bad{color:var(--bad);border-color:#ef444455;background:#ef444414}
.pill.demo{color:var(--mut);border-color:var(--line2);background:none;margin-left:auto}
.metric{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
.metric small{font-size:9.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.metric b{font:600 13px var(--mono)}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:15px}
.sig i{width:3px;background:#2a3a52;border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:7px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:15px}
.sig i.on{background:currentColor}
.main{grid-column:2;overflow:auto;padding:20px 24px 50px;position:relative}
.phead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px}
.phead h1{font-size:21px;font-weight:600;letter-spacing:-.01em}
.phead p{color:var(--mut);margin-top:2px}
.acts{display:flex;gap:8px;align-items:center}
.btn{height:30px;padding:0 13px;background:var(--panel);border:1px solid var(--line2);border-radius:3px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#00131f;font-weight:600}
.btn.pri:hover{filter:brightness(1.12);color:#00131f}
.btn.dan{border-color:#ef444466;color:#f87171}
.btn.dan:hover{background:#ef444422;border-color:var(--bad);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn kbd{font:600 10px var(--mono);padding:1px 5px;border:1px solid currentColor;border-radius:2px;opacity:.6}
.banner{display:flex;align-items:center;gap:12px;background:#f59e0b17;border:1px solid #f59e0b66;color:#fbbf24;padding:9px 14px;border-radius:3px;margin-bottom:16px;font-weight:500}
.banner .sp{flex:1}
.banner b{font-family:var(--mono);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#c3cee0}
.card>header h3 small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--mut);margin-left:8px}
.body{padding:14px}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gl{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.gf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.gf3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.lab{font-size:10.5px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.tip{display:inline-grid;place-items:center;width:13px;height:13px;border:1px solid var(--line2);border-radius:50%;font:600 9px var(--mono);color:var(--dim);font-style:normal;cursor:help;letter-spacing:0;text-transform:none}
.tip:hover{color:var(--accent);border-color:var(--accent)}
#tt{position:fixed;z-index:200;max-width:270px;background:#050a10;border:1px solid var(--line2);padding:8px 11px;border-radius:3px;font:400 11.5px/1.45 var(--sans);color:var(--text);box-shadow:0 10px 30px #000c;pointer-events:none}
#tt[hidden]{display:none}
.hint{font-size:11px;color:var(--dim)}
.hint.warn{color:var(--warn)}
input[type=number],input[type=text],select{height:30px;background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:0 9px;width:100%;outline:none;min-width:0}
input[type=text]{font-family:var(--mono);font-size:12px}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px #00b4ff22}
input[disabled],select[disabled]{opacity:.42}
input.bad{border-color:var(--bad)}
input[type=number]{-moz-appearance:textfield;appearance:textfield;font-family:var(--mono);font-size:12px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px;cursor:pointer}
select option{background:#0c121b}
.stepper{display:flex;align-items:stretch}
.stepper input{text-align:center;border-radius:0;border-left:0;border-right:0}
.row3 .stepper .unit{display:none}
.stepper button{width:24px;flex:none;background:var(--panel2);border:1px solid var(--line2);cursor:pointer;color:var(--mut)}
.stepper button:first-child{border-radius:3px 0 0 3px}
.stepper button:last-child{border-radius:0 3px 3px 0}
.stepper button:hover{color:var(--accent);border-color:var(--accent)}
.stepper .unit{display:flex;align-items:center;margin-left:7px;color:var(--dim);font:11px var(--mono)}
.tg{display:inline-flex;align-items:center;gap:9px;cursor:pointer;height:30px}
.tg input{display:none}
.trk{width:34px;height:18px;background:#1b2636;border:1px solid var(--line2);border-radius:9px;position:relative;transition:.15s;flex:none}
.trk::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--mut);transition:.15s}
.tg input:checked+.trk{background:#00b4ff33;border-color:var(--accent)}
.tg input:checked+.trk::after{left:18px;background:var(--accent)}
.tg em{font-style:normal;color:var(--mut);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),#223048 var(--p,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:15px;border-radius:2px;background:#e8f6ff;border:2px solid var(--accent);cursor:grab}
input[type=range]::-moz-range-thumb{width:9px;height:11px;border-radius:2px;background:#e8f6ff;border:2px solid var(--accent)}
.rng{display:flex;align-items:center;gap:12px;height:30px}
.rng .val{min-width:60px;text-align:right;color:var(--accent);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;align-self:flex-start}
.seg button{background:var(--bg);border:0;padding:0 15px;height:28px;cursor:pointer;color:var(--mut);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accentd);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 18px;color:var(--mut);cursor:pointer;font-weight:500;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #152030;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#ffffff04}
td.empty{text-align:center;color:var(--dim);padding:26px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--tc,var(--accent))}
.tile small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tile b{display:block;font:600 21px var(--mono);margin:4px 0 1px;white-space:nowrap}
.tile span{font-size:11px;color:var(--mut)}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.bar{display:grid;grid-template-columns:44px 150px 1fr 170px;gap:12px;align-items:center;padding:5px 0}
.bar .bn{color:var(--c);font-weight:600;font-size:12px}
.bar .bl{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bv{font-size:11.5px;text-align:right;white-space:pre}
.bt2{height:10px;background:#0a1019;border:1px solid var(--line);position:relative;border-radius:2px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.85}
.bc{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff66}
.sticks{display:flex;gap:14px;justify-content:center}
.pad{width:47%;text-align:center}
.pad svg{width:100%;display:block;background:#0a1019;border:1px solid var(--line)}
.pad svg rect{fill:none;stroke:var(--line2);stroke-width:.6}
.pad svg line{stroke:#1d2a3d;stroke-width:.6}
.pad svg circle{fill:var(--accent);filter:drop-shadow(0 0 3px var(--accent))}
.pad span{display:block;margin-top:6px;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line2);border-radius:3px;font:11px var(--mono);color:var(--mut);white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip.on{border-color:var(--accent);color:var(--accent)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{height:42px;justify-content:flex-start;padding:0 14px}
.legend{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:3px;margin-right:6px;vertical-align:middle;border-radius:1px}
.cbox{height:150px;position:relative}
.cbox.tall{height:210px}
canvas{width:100%;height:100%;display:block}
.ch>header .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);flex:none}
.ch>header .chip{margin-left:auto;color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.chbody{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:18px;padding:14px}
.chform{display:flex;flex-direction:column;gap:12px;min-width:0}
.curvebox{display:flex;flex-direction:column;gap:8px}
.curve{width:100%;background:#0a1019;border:1px solid var(--line);display:block}
.curve .g{stroke:#18253a;stroke-width:.5}
.curve .a{stroke:#26364f;stroke-width:.7}
.curve polyline{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linejoin:round}
.curve polyline.lo{stroke:var(--warn);stroke-dasharray:3 2;stroke-width:1.2}
.curve circle{fill:#fff;stroke:var(--c);stroke-width:1.5}
.curvebox small{text-align:center;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.ch footer{border-top:1px solid var(--line);padding:9px 14px;font-size:11.5px;color:var(--mut);background:var(--panel2)}
.ch footer b{color:var(--text);font-weight:600}
.note{padding:10px 12px;border:1px dashed var(--line2);border-radius:3px;color:var(--mut);font-size:12px}
.note.warn{border-color:#f59e0b66;color:#fbbf24;background:#f59e0b0d;border-style:solid}
.note.bad{border-color:#ef444466;color:#fca5a5;background:#ef44440d;border-style:solid}
.hd{cursor:grab;color:var(--dim);width:22px;text-align:center;user-select:none}
.mix td{padding:6px 8px}
.mix tr.live td{background:#00b4ff0b}
.mix tr.live td:first-child{box-shadow:inset 2px 0 var(--accent)}
.mix tr.over td{border-top:2px solid var(--accent)}
.x{width:26px;height:26px;background:none;border:1px solid var(--line2);border-radius:3px;cursor:pointer;color:var(--mut)}
.x:hover{border-color:var(--bad);color:var(--bad)}
.mp{display:grid;grid-template-columns:200px 1fr 360px;gap:16px;align-items:center;padding:8px 0;border-bottom:1px solid #152030}
.mp:last-child{border-bottom:0}
.mph b{color:var(--c);margin-right:8px}
.mpt{height:12px;background:#0a1019;border:1px solid var(--line);position:relative;border-radius:2px}
.mpt::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#ffffff44}
.mpt .sp{position:absolute;top:3px;height:4px;background:var(--c);opacity:.55}
.mpt .mk{position:absolute;top:-3px;width:3px;height:16px;margin-left:-1px;border-radius:1px}
.mpt .mk.b{background:#8493ab}
.mpt .mk.f{background:var(--c)}
.mpc{font-size:11.5px;color:var(--mut);line-height:1.5}
.mpc b{color:var(--text);font-weight:600}
.adc{position:relative;height:30px;background:#0a1019;border:1px solid var(--line);border-radius:2px;margin:2px 0 22px}
.adc .zone{position:absolute;top:0;bottom:0;background:#00b4ff1c;border-left:1px solid var(--accent);border-right:1px solid var(--accent)}
.adc .mk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px}
.adc .mk.cn{background:var(--ok)}
.adc .needle{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 8px #fff9;border-radius:1px}
.adc .scale{position:absolute;left:0;right:0;top:34px;display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.kv small{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.kv b{font:600 14px var(--mono)}
.cap{color:var(--accent);font-size:12px}
.pos{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin-top:2px}
.pos button{flex:1;height:34px;background:var(--bg);border:0;border-right:1px solid var(--line2);color:var(--dim);cursor:pointer;font-size:12px;font-weight:500}
.pos button:last-child{border-right:0}
.pos button.on{background:var(--accent);color:#00131f;font-weight:700}
.swhead{display:flex;align-items:center;gap:10px}
.hex{display:flex;flex-wrap:wrap;gap:4px;font:12px var(--mono)}
.hex span{padding:3px 6px;background:var(--panel2);border:1px solid var(--line);border-radius:2px}
.hex span.hd2{border-color:var(--accent);color:var(--accent)}
.hex span.fl{border-color:var(--warn);color:var(--warn)}
.hex span.ed{border-color:var(--dim);color:var(--dim)}
.meter{height:8px;background:#0a1019;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#0086c0,var(--accent))}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:12px}
.calc span:nth-child(odd){color:var(--mut)}
.calc span:nth-child(even){text-align:right;font-family:var(--mono);color:var(--text)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.console{background:#04070b;border:1px solid var(--line);height:270px;overflow:auto;padding:9px 12px;font:11.5px/1.6 var(--mono);white-space:pre-wrap}
.console .l0{color:#f87171}.console .l1{color:#fbbf24}.console .l2{color:#d5deeb}.console .l3{color:#7dd3fc}.console .l4{color:#5a6a82}
.console .tm{color:#3d4b61}
.prog{height:8px;background:#0a1019;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.steps{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:9px}
.steps li{counter-increment:s;display:flex;gap:11px;color:var(--mut)}
.steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--mono);color:var(--accent)}
.modalwrap{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:100}
.modalwrap[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:4px;width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 80px #000}
.mbox>header{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.mbox>header h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mbox>header button{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.mbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px;color:var(--mut)}

.toast{background:#0c1a28;border:1px solid var(--accent);border-left-width:3px;padding:10px 16px;border-radius:3px;box-shadow:0 8px 30px #000a;animation:ti .2s ease;font-weight:500}
.toast.warn{border-color:var(--warn)}
.toast.bad{border-color:var(--bad)}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.fsb{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid #ef444477;background:linear-gradient(90deg,#ef44441c,#ef44440a);border-radius:3px;margin-bottom:14px}
.fsb svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

function loraCalc(l){
const bw=l.bw*1000,sf=l.sf,crI=l.cr-4;
const tsym=Math.pow(2,sf)/bw*1000;
const de=tsym>16?1:0;
const ih=l.implicit?1:0,crc=l.crc?1:0;
const nu=8*l.payload-4*sf+28+16*crc-20*ih;
const den=4*(sf-2*de);
const nPay=8+Math.max(Math.ceil(nu/den)*(crI+4),0);
const air=(l.preamble+4.25)*tsym+nPay*tsym;
const dr=sf*(bw/Math.pow(2,sf))*(4/(4+crI));
const lim={6:-5,7:-7.5,8:-10,9:-12.5,10:-15,11:-17.5,12:-20}[sf];
const sens=-174+10*Math.log10(bw)+6+lim;
const lb=l.power-sens;
const f=l.freq+l.tune/1000;
const range=Math.pow(10,(lb-55-32.44-20*Math.log10(f))/20);
return{tsym,air,dr,sens,lb,range,maxHz:1000/air,f};
}

function normAdc(a,c){
const d=a-c.center;
if(Math.abs(d)<=c.db)return 0;
if(d>0)return clamp((d-c.db)/Math.max(1,c.max-c.center-c.db),0,1);
return clamp((d+c.db)/Math.max(1,c.center-c.min-c.db),-1,0);
}
const shape=(n,c)=>{const e=c.expo/100;return (1-e)*n+e*n*n*n};
const divRatio=c=>c.div==='1:1'?1:c.div==='2:1'?2:(c.rt+c.rb)/c.rb;

function failsafeVal(N){
const m=cfg.sbus.fsMode;
if(m==='nopulse')return null;
if(m==='hold')return toSbus(lastGood[N]);
const f=cfg.failsafe.ch[N];
if(f.mode==='hold')return toSbus(lastGood[N]);
if(f.mode==='cut')return 172;
return f.value;
}
function slotVal(j){
const s=cfg.sbus.slots[j];
if(s.src==='off')return 992;
if(s.src==='fixed')return s.fv;
const N=+s.src.slice(2);
return st.fs?failsafeVal(N):toSbus(st.out[N]);
}
function sbusFrame(vals,flags){
const b=new Uint8Array(25);b[0]=0x0F;
let bit=0;
for(let i=0;i<16;i++){const v=vals[i]&0x7ff;for(let k=0;k<11;k++){if((v>>k)&1){const p=bit+k;b[1+(p>>3)]|=1<<(p&7)}}bit+=11}
b[23]=flags;b[24]=0;
return b;
}

function pipeline(){
const t=sim.t;
let sn;
if(sim.mode==='center')sn=[0,0,0,0];
else if(sim.mode==='sweep')sn=[0,1,2,3].map(i=>clamp(Math.sin(t*2.6+i*1.3)*1.3,-1,1));
else sn=[Math.sin(t*0.7)*0.8*Math.cos(t*0.13),Math.sin(t*0.5+1)*0.7,Math.sin(t*0.23+2)*0.9,Math.sin(t*0.4+3)*0.6];
for(let i=0;i<4;i++){
const raw=sn[i]>=0?HW.c+sn[i]*(HW.max-HW.c):HW.c+sn[i]*(HW.c-HW.min);
st.adc[i]=Math.round(raw+(Math.random()-0.5)*5);
st.n[i]=normAdc(st.adc[i],cfg.cal[i]);
}
for(let i=0;i<10;i++){
const c=cfg.channels[i];
let us,nin=0,nout=0;
if(c.src<4){
let n=st.n[c.src];if(c.rev)n=-n;nin=n;
const low=c.dr&&swPos(c.drSw)===2;
const y=shape(n,c)*((low?c.drLo:c.drHi)/100);
nout=y;
us=y>=0?c.center+y*(c.max-c.center):c.center+y*(c.center-c.min);
if(Math.abs(us-c.center)<c.db)us=c.center;
us+=c.sub;
}else if(c.src<10){
const k=c.src-4;us=cfg.switches[k].vals[swPos(k)];if(c.rev)us=3000-us;
}else us=c.fixed;
st.base[i]=clamp(us,1000,2000);
st.info[i]={nin:nin,nout:nout};
}
const o=st.base.slice();
cfg.mixer.forEach((m,k)=>{
let d=0;
if(m.on&&swCond(m)){d=(o[m.src]-1500)*m.rate/100+m.off*5;o[m.dst]=clamp(o[m.dst]+d,1000,2000)}
st.mixc[k]=d;
});
const fsOn=sim.fsUntil>performance.now();
if(!fsOn){st.out=o;lastGood=o.slice()}
st.fs=fsOn;
for(let j=0;j<16;j++)st.sbus[j]=slotVal(j);
Object.keys(capture).forEach(i=>{const c=capture[i];c.min=Math.min(c.min,st.adc[i]);c.max=Math.max(c.max,st.adc[i])});
}

function stepLink(dt){
const r=cfg.radio,fb=r.fb;

const nz=()=>Math.random()-0.5;

let want=link.proto;
if(fb.primary==='espnow')want='espnow';
else if(fb.primary==='lora')want='lora';
else if(fb.trigger!=='manual'){
const thr=fb.trigger==='rssi'?fb.rssiThr:-92;
if(link.proto==='espnow'){
if(link.esp<thr)link.bad+=dt*1000;else link.bad=0;
const need=fb.trigger==='ack'?r.espnow.ackTimeout:0;
if(link.bad>need)want='lora';
}else{
link.rec+=dt*1000;
if(link.rec>=fb.recover){link.rec=0;if(link.esp>thr+8)want='espnow'}
}
}
if(want!==link.proto){
link.proto=want;link.switches++;link.bad=0;link.rec=0;
events.push({t:sim.t,to:want});
log(want==='lora'?1:2,'LINK','switch to '+(want==='lora'?'LoRa 433':'ESP-NOW')+' esp_rssi='+link.esp.toFixed(0)+' dBm');
}
const lt=link.proto==='espnow'?Math.pow(clamp((-link.esp-72)/28,0,1),2)*45:clamp((-link.lora-92)/16,0,1)*12;
link.loss=lerp(link.loss,lt+Math.random()*0.8,0.2);
const lc=loraCalc(r.lora);
link.lat=link.proto==='espnow'?1.1+Math.random()*1.4+link.loss*0.06:lc.air+6+Math.random()*4;
const rate=link.proto==='espnow'?r.espnow.rate:Math.min(lc.maxHz,40);
const s=rate*dt;
link.sent+=s;link.recv+=s*(1-link.loss/100);link.lost+=s*link.loss/100;
link.txV=5.94-sim.t*0.00002+nz()*0.01;
link.rxV=5.02+nz()*0.02;
}

stats.n++;stats.sum+=r;stats.min=Math.min(stats.min,r);stats.max=Math.max(stats.max,r);
}

function setupCanvas(cv){
const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
if(!w||!h)return null;
if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
return{g:g,w:w,h:h};
}
function drawHealth(cv){
if(!cv)return;
const c=setupCanvas(cv);if(!c)return;
const g=c.g,w=c.w,h=c.h,L=34,R=6,T=4,B=4,pw=w-L-R,n=60,bw=pw/n;
const rec=hist.slice(-n);
rec.forEach((p,i)=>{g.fillStyle=p.proto==='espnow'?'#00b4ff':'#f59e0b';g.fillRect(L+(n-rec.length+i)*bw,T,bw+0.6,14)});
const y0=T+24,ph=h-y0-B-14;
g.strokeStyle='#1b2636';g.fillStyle='#5a6a82';g.font='10px monospace';g.textAlign='right';g.textBaseline='middle';
for(let i=0;i<=2;i++){const y=y0+ph*i/2;g.beginPath();g.moveTo(L,y+.5);g.lineTo(L+pw,y+.5);g.stroke();g.fillText((50-25*i)+'%',L-5,y)}
g.strokeStyle='#ef4444';g.lineWidth=1.6;g.beginPath();
rec.forEach((p,i)=>{const x=L+(n-rec.length+i)*bw,y=y0+ph-clamp(p.loss/50,0,1)*ph;i?g.lineTo(x,y):g.moveTo(x,y)});
g.stroke();
g.fillStyle='#5a6a82';g.textAlign='left';g.fillText('protocol',L,h-4);
}
function drawChart(cv,o){
if(!cv)return;
const c=setupCanvas(cv);if(!c)return;
const g=c.g,w=c.w,h=c.h,L=46,R=10,T=10,B=22,pw=w-L-R,ph=h-T-B,win=60,now=sim.t;
g.font='10px monospace';g.lineWidth=1;
for(let i=0;i<=4;i++){
const y=T+ph*i/4;g.strokeStyle='#1b2636';g.beginPath();g.moveTo(L,y+.5);g.lineTo(L+pw,y+.5);g.stroke();
g.fillStyle='#5a6a82';g.textAlign='right';g.textBaseline='middle';g.fillText((o.max-(o.max-o.min)*i/4).toFixed(o.dec||0),L-6,y);
}
g.textAlign='center';g.textBaseline='top';
for(let i=0;i<=4;i++)g.fillText(i===4?'now':'-'+(win-i*15)+'s',L+pw*i/4,T+ph+6);
const X=t=>L+(t-(now-win))/win*pw,Y=v=>T+ph-(clamp(v,o.min,o.max)-o.min)/(o.max-o.min)*ph;
g.setLineDash([3,3]);g.strokeStyle='#f59e0b99';
events.forEach(e=>{if(e.t>=now-win){const x=X(e.t);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke()}});
g.setLineDash([]);
const rec=hist.slice(-130);
o.series.forEach(s=>{
g.strokeStyle=s.c;g.lineWidth=1.7;g.beginPath();let on=false;
rec.forEach(p=>{if(p.t<now-win-1)return;const x=X(p.t),y=Y(p[s.k]);if(!on){g.moveTo(x,y);on=true}else g.lineTo(x,y)});
g.stroke();
});
}

function onField(e){
const t=e.target,p=t.dataset&&t.dataset.path;
if(!p)return;
const disc=t.tagName==='SELECT'||t.type==='checkbox';
if(disc&&e.type!=='change')return;
if(!disc&&t.type!=='number'&&e.type!=='input')return;
let v;
if(t.type==='checkbox')v=t.checked;
else if(t.type==='number'||t.type==='range'){
v=parseFloat(t.value);if(isNaN(v))return;
if(t.type==='number'){
const mn=parseFloat(t.min),mx=parseFloat(t.max);
if(e.type==='change'){v=clamp(v,mn,mx);t.value=v}
else if(v<mn||v>mx)return;
}
}else if(t.tagName==='SELECT')v=t.dataset.type==='n'?Number(t.value):t.value;
else v=t.value;
set(cfg,p,v);
if(t.dataset.vre)t.classList.toggle('bad',!new RegExp(t.dataset.vre).test(t.value));
if(p.indexOf('switches.')===0&&p.endsWith('.type')){const k=+p.split('.')[1];if(v!=='3pos'&&sim.sw[k]===1)sim.sw[k]=0}
markDirty();refreshVals();
if(t.dataset.rerender){renderPage();return}
if(U[cur])U[cur](true);
}

const t=e.target;
if(t.dataset&&t.dataset.assign!==undefined){
const k=+t.dataset.assign,ch=+t.value;
cfg.channels.forEach((c,i)=>{if(c.src===4+k)c.src=10});
if(ch>=0)cfg.channels[ch].src=4+k;
markDirtyPage('channels');markDirtyPage('switches');
renderPage();

if(t.id==='otaFile'){
const f=t.files[0];
$('#otaBtn').disabled=!f||!/\.bin$/i.test(f.name);
$('#otaTxt').textContent=f?f.name+' · '+(f.size/1024).toFixed(1)+' KB':'';
}
if(t.id==='importFile'){
const f=t.files[0];if(!f)return;
const r=new FileReader();
r.onload=()=>{
try{
const j=JSON.parse(r.result);

if(!n)throw new Error('empty');
navDirty();renderPage();log(2,'CFG','imported '+n+' sections');toast('Imported '+n+' sections. Review and save each page.','warn');
}catch(err){toast('Invalid configuration file','bad')}
t.value='';
};
r.readAsText(f);
}
});

function otaSet(txt,pct){
const t=$('#otaTxt'),b=$('#otaBar');
if(t)t.textContent=txt;
if(b)b.style.width=pct+'%';
}
function otaEnable(on){const b=$('#otaBtn');if(b)b.disabled=!on}
function otaFail(msg){
otaSet(msg,0);otaEnable(true);
log(0,'OTA',msg);toast(msg,'bad');
}
function otaDone(){
sim.rebootUntil=performance.now()+3500;
log(2,'OTA','flash complete, device rebooting');
if(location.protocol==='file:'){otaSet('Flashed (demo). Rebooting…',100);otaEnable(true);toast('Demo update finished');return}
otaSet('Flashed. Waiting for device…',100);
let n=0;
setTimeout(()=>{
const iv=setInterval(()=>{
n++;
fetch(location.pathname,{cache:'no-store'}).then(r=>{if(r.ok){clearInterval(iv);otaSet('Device is back online',100);otaEnable(true);log(2,'OTA','device back online');toast('Update complete')}}).catch(()=>{});
if(n>30){clearInterval(iv);otaSet('No response after 30 s. Check the device.',100);otaEnable(true);toast('Device did not come back','warn')}
},1000);
},4000);
}
async function otaFlash(){
const inp=$('#otaFile'),f=inp&&inp.files[0];
if(!f)return;
if(!/\.bin$/i.test(f.name))return otaFail('Not a .bin file');
if(f.size<1024)return otaFail('File is too small to be a firmware image');
if(f.size>0x1E0000)return otaFail('Image is larger than the biggest OTA slot (1.9 MB)');
const head=new Uint8Array(await f.slice(0,1).arrayBuffer());
if(head[0]!==0xE9)return otaFail('Not an ESP32 app image (missing 0xE9 header)');
otaEnable(false);
log(2,'OTA','upload started: '+f.name+' ('+f.size+' B)');
if(location.protocol==='file:'){
let p=0;
const iv=setInterval(()=>{p+=2+Math.random()*5;if(p>=100){clearInterval(iv);otaDone()}else otaSet('Uploading '+p.toFixed(0)+' %',p)},120);
return;
}
const xhr=new XMLHttpRequest();
xhr.open('POST','/update');
xhr.timeout=180000;
xhr.upload.onprogress=e=>{if(e.lengthComputable)otaSet('Uploading '+(e.loaded/e.total*100).toFixed(0)+' %',e.loaded/e.total*100)};
let watch=null;
xhr.upload.onload=()=>{
otaSet('Verifying on device…',100);
watch=setTimeout(()=>{xhr.abort();otaFail('No reply from device after upload. Check it before flying.')},30000);
};
xhr.onload=()=>{
clearTimeout(watch);
if(xhr.status===200&&/^OK/i.test(xhr.responseText.trim()))otaDone();
else otaFail('Device rejected the update ('+xhr.status+' '+xhr.responseText.trim().slice(0,60)+')');
};
xhr.onerror=()=>{clearTimeout(watch);otaFail('Connection lost during upload')};
xhr.ontimeout=()=>{clearTimeout(watch);otaFail('Upload timed out')};
const fd=new FormData();
fd.append('firmware',f,f.name);
xhr.send(fd);
}

case'discard':discard();break;
case'reset':resetPage();break;
case'addmix':if(cfg.mixer.length<10){cfg.mixer.push({on:true,src:0,dst:1,rate:0,off:0,sw:'none'});markDirty();renderPage()}break;
case'delmix':cfg.mixer.splice(+el.dataset.i,1);markDirty();renderPage();break;
case'preset':{const a=el.dataset.v.split('-');const l=cfg.radio.lora;l.sf=+a[0];l.bw=+a[1];if(l.sf===6)l.implicit=true;markDirty();renderPage();toast('Preset applied');break}
case'scan':scanModal();break;
case'genpmk':cfg.radio.espnow.pmk=hex16();markDirty();renderPage();break;
case'genlmk':cfg.radio.espnow.lmk=hex16();markDirty();renderPage();break;
case'calstart':{const i=+el.dataset.i;
if(capture[i]){const cp=capture[i];if(cp.max>cp.min+500){cfg.cal[i].min=cp.min;cfg.cal[i].max=cp.max;markDirty()}delete capture[i];if(!Object.keys(capture).length)sim.mode='auto'}
else{capture[i]={min:4095,max:0};sim.mode='sweep'}
renderPage();break}
case'calcenter':cfg.cal[+el.dataset.i].center=st.adc[+el.dataset.i];markDirty();renderPage();toast('Centre captured');break;
case'calwizard':calWizard();break;
case'bind':bindModal();break;
case'centertrims':cfg.channels.forEach(c=>{c.sub=0});markDirtyPage('channels');toast('All subtrims set to 0. Save on the Channels page.','warn');break;
case'calreset':cfg.cal=defaults().cal;markDirtyPage('calibration');toast('Calibration reset. Save on the Calibration page.','warn');break;
case'fstest':startFS();break;
case'reboot':openModal({title:'Reboot transmitter',body:'<p>The link will drop for a few seconds. Make sure the aircraft is disarmed.</p>',buttons:[{label:'Cancel'},{label:'Reboot',cls:'dan',fn:()=>{sim.rebootUntil=performance.now()+3500;log(1,'SYS','reboot requested');toast('Rebooting…','warn')}}]});break;
case'simdist':sim.dist=el.dataset.v;$$('[data-act=simdist]').forEach(b=>b.classList.toggle('on',b===el));break;
case'csv':{let s='t_s,protocol,esp_rssi_dbm,lora_rssi_dbm,snr_db,loss_pct,latency_ms\n';hist.forEach(p=>{s+=[p.t.toFixed(2),p.proto,p.esp.toFixed(1),p.lora.toFixed(1),p.snr.toFixed(1),p.loss.toFixed(2),p.lat.toFixed(2)].join(',')+'\n'});download('telemetry.csv','text/csv',s);break}
case'export':download('transmitter-config.json','application/json',JSON.stringify(cfg,null,2));toast('Config exported');break;
case'import':$('#importFile').click();break;
case'factory':openModal({title:'Reset everything',body:'<p>All pages return to factory defaults and any saved changes are lost.</p>',buttons:[{label:'Cancel'},{label:'Reset all',cls:'dan',fn:()=>{cfg=defaults();saved=clone(cfg);dirty={};capture={};navDirty();renderPage();log(1,'CFG','factory reset');toast('Factory defaults restored','warn')}}]});break;
case'ota':otaFlash();break;
case'clearlog':logs=[];U.system(true);break;
}
}

document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.tip'))tt.hidden=true});

function buildNav(){
$('#nav').innerHTML=PAGES.map(p=>'<button class="ni" data-id="'+p.id+'" title="'+p.label+'"><svg viewBox="0 0 24 24">'+ICON[p.id]+'</svg><span class="t">'+p.label+'</span><i class="nd"></i></button>').join('');
}
$('#collapse').addEventListener('click',()=>{
const a=$('#app');a.classList.toggle('col');
$('#collapse svg').innerHTML=a.classList.contains('col')?'<polyline points="9 18 15 12 9 6"/>':'<polyline points="15 18 9 12 15 6"/>';
try{localStorage.setItem('txcfg.col',a.classList.contains('col')?'1':'')}catch(x){}
setTimeout(()=>{if(U[cur])U[cur](true)},50);
});
window.addEventListener('resize',()=>{if(cur==='telemetry'||cur==='dashboard')U[cur](true)});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==cur)go(id)});

function tick(){
sim.t+=0.05;sim.n++;
stepLink(0.05);
pipeline();
if(sim.n%10===0)sample();
if(sim.n%20===0){
sim.seq++;
log(4,'ESPNOW','tx seq='+sim.seq+' rssi='+link.esp.toFixed(0)+' loss='+link.loss.toFixed(1)+'%');
heap=218+Math.sin(sim.t/3)*3+(Math.random()-0.5);
}
if(sim.n%100===0)log(3,'LINK','proto='+link.proto+' esp='+link.esp.toFixed(0)+' lora='+link.lora.toFixed(0)+' snr='+link.snr.toFixed(1));
updateTop();
const u=U[cur];
if(u){if(cur==='radio'){if(sim.n%10===0)u(true)}else u(false)}
}

log(2,'BOOT','ESP32 DevKit v1 starting');
log(2,'BOOT','SX1278 init ok, 433.000 MHz');
log(2,'BOOT','ESP-NOW peer added AA:BB:CC:DD:EE:FF');
log(2,'LINK','active protocol: ESP-NOW');
try{if(localStorage.getItem('txcfg.col')){$('#app').classList.add('col');$('#collapse svg').innerHTML='<polyline points="9 18 15 12 9 6"/>'}}catch(x){}
buildNav();
pipeline();
sim.t=-30;
for(let i=0;i<60;i++){sim.t+=0.5;stepLink(0.5);pipeline();sample()}
link.sent=0;link.recv=0;link.lost=0;
stats.n=0;stats.sum=0;stats.min=Infinity;stats.max=-Infinity;
go(location.hash.slice(1)||'dashboard');
setInterval(tick,50);
})();
</script>
</body>
</html>
